name: Abstention Evaluation

on:
  push:
    branches:
      - ml/run-abstention-evaluation
    paths:
      - .github/workflows/abstention-evaluation.yml
      - ml/**
      - app/src/main/java/my/diplom/aritmia/diagnosis/FreeTextSymptomExtractor.kt
      - app/src/test/java/my/diplom/aritmia/diagnosis/CuratedRussianOodExtractionTest.kt
      - app/src/test/java/my/diplom/aritmia/diagnosis/CuratedScopeBoundaryExtractionTest.kt
      - app/src/test/java/my/diplom/aritmia/diagnosis/CuratedPretrainedMlpChallengeTest.kt
      - app/src/test/java/my/diplom/aritmia/diagnosis/FrozenRussianRobustnessChallengeTest.kt
      - app/src/test/java/my/diplom/aritmia/diagnosis/ExtractorMorphologyRobustnessTest.kt
      - app/src/test/java/my/diplom/aritmia/diagnosis/DiseaseCatalogResearchExportTest.kt
  workflow_dispatch:

concurrency:
  group: abstention-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Export concepts, catalog and exact pretrained MLP challenges with real Kotlin code
        run: |
          ./gradlew testDebugUnitTest \
            --tests my.diplom.aritmia.diagnosis.FreeTextSymptomExtractorTest \
            --tests my.diplom.aritmia.diagnosis.ExtractorMorphologyRobustnessTest \
            --tests my.diplom.aritmia.diagnosis.CuratedRussianOodExtractionTest \
            --tests my.diplom.aritmia.diagnosis.CuratedScopeBoundaryExtractionTest \
            --tests my.diplom.aritmia.diagnosis.CuratedPretrainedMlpChallengeTest \
            --tests my.diplom.aritmia.diagnosis.FrozenRussianRobustnessChallengeTest \
            --tests my.diplom.aritmia.diagnosis.DiseaseCatalogResearchExportTest \
            --stacktrace --no-daemon
          CURATED_JSON="$(find app/build build -type f -name 'curated_russian_ood_extractions.json' -print -quit 2>/dev/null || true)"
          BOUNDARY_JSON="$(find app/build build -type f -name 'curated_scope_boundary_extractions.json' -print -quit 2>/dev/null || true)"
          MLP_JSON="$(find app/build build -type f -name 'pretrained_mlp_curated_report.json' -print -quit 2>/dev/null || true)"
          ROBUSTNESS_JSON="$(find app/build build -type f -name 'frozen_russian_robustness_report.json' -print -quit 2>/dev/null || true)"
          CATALOG_JSON="$(find app/build build -type f -name 'disease_catalog_weights.json' -print -quit 2>/dev/null || true)"
          test -n "$CURATED_JSON"
          test -n "$BOUNDARY_JSON"
          test -n "$MLP_JSON"
          test -n "$ROBUSTNESS_JSON"
          test -n "$CATALOG_JSON"
          echo "CURATED_JSON=$CURATED_JSON" >> "$GITHUB_ENV"
          echo "BOUNDARY_JSON=$BOUNDARY_JSON" >> "$GITHUB_ENV"
          echo "MLP_JSON=$MLP_JSON" >> "$GITHUB_ENV"
          echo "ROBUSTNESS_JSON=$ROBUSTNESS_JSON" >> "$GITHUB_ENV"
          echo "CATALOG_JSON=$CATALOG_JSON" >> "$GITHUB_ENV"
          cat "$CURATED_JSON"
          cat "$BOUNDARY_JSON"
          cat "$MLP_JSON"
          cat "$ROBUSTNESS_JSON"
          cat "$CATALOG_JSON"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt

      - name: Download exact public 820-disease dataset
        run: |
          set -euo pipefail
          mkdir -p build/abstention-data
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.kaggle.com/api/v1/datasets/download/badhanamitroy/symptom-to-disease-descriptions-820-cleaned' \
            --output build/abstention-data/dataset.zip
          unzip -q build/abstention-data/dataset.zip -d build/abstention-data/extracted
          CSV="$(find build/abstention-data/extracted -type f -name 'unified_820_diseases_symptoms_dataset_ROWLEVEL_CLEANED.csv' -print -quit)"
          test -n "$CSV"
          echo "CSV_PATH=$CSV" >> "$GITHUB_ENV"

      - name: Validate source dataset identity
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          path = Path(os.environ['CSV_PATH'])
          with path.open('r', encoding='utf-8', newline='') as fh:
              reader = csv.reader(fh)
              header = next(reader)
              rows = sum(1 for _ in reader)

          print({'file': path.name, 'rows': rows, 'columns': len(header)})
          if path.name != 'unified_820_diseases_symptoms_dataset_ROWLEVEL_CLEANED.csv':
              raise SystemExit('Unexpected dataset filename')
          if rows != 190672 or len(header) != 655:
              raise SystemExit(f'Unexpected dataset shape: {rows} x {len(header)}')
          PY

      - name: Evaluate baseline abstention and OOD operating points
        run: |
          python ml/evaluate_abstention.py \
            --csv "$CSV_PATH" \
            --output abstention_report.json

      - name: Evaluate explicit evidence gates
        run: |
          python ml/evaluate_evidence_gates.py \
            --csv "$CSV_PATH" \
            --output evidence_gate_report.json

      - name: Evaluate catalog specificity gate
        run: |
          python ml/evaluate_specificity_gate.py \
            --csv "$CSV_PATH" \
            --catalog-json "$CATALOG_JSON" \
            --frozen-json "$ROBUSTNESS_JSON" \
            --output specificity_gate_report.json

      - name: Evaluate complaint-concept scope detector
        run: |
          python ml/evaluate_scope_detector.py \
            --csv "$CSV_PATH" \
            --output scope_detector_report.json

      - name: Evaluate curated Russian free-text OOD after Kotlin extraction
        run: |
          python ml/evaluate_curated_text_scope.py \
            --csv "$CSV_PATH" \
            --curated-json "$CURATED_JSON" \
            --output curated_text_scope_report.json

      - name: Evaluate positive and hard-boundary Russian complaints
        run: |
          python ml/evaluate_curated_scope_boundary.py \
            --csv "$CSV_PATH" \
            --cases-json "$BOUNDARY_JSON" \
            --output curated_scope_boundary_report.json

      - name: Upload abstention reports
        uses: actions/upload-artifact@v4
        with:
          name: abstention-reports
          path: |
            abstention_report.json
            evidence_gate_report.json
            specificity_gate_report.json
            scope_detector_report.json
            curated_text_scope_report.json
            curated_scope_boundary_report.json
            ${{ env.CURATED_JSON }}
            ${{ env.BOUNDARY_JSON }}
            ${{ env.MLP_JSON }}
            ${{ env.ROBUSTNESS_JSON }}
            ${{ env.CATALOG_JSON }}
          if-no-files-found: error
